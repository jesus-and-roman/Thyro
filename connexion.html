<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thyro — Se connecter</title>
<link rel="stylesheet" href="assets/css/thyro.css">
</head>
<body>
<div class="thyro-shell">

  <aside class="thyro-rail">
    <div>
      <div class="thyro-word">thy<span>ro</span></div>
      <p class="thyro-rail-copy" style="margin-top:18px;">
        Un seul compte, un seul endroit. Connecte-toi pour continuer.
      </p>
    </div>
    <p class="thyro-rail-copy">
      Pas encore de compte ?<br>
      <a href="inscription.html" style="color:var(--accent); text-decoration:none;">Créer un compte →</a>
    </p>
  </aside>

  <main class="thyro-main">
    <nav class="thyro-tabs">
      <a href="connexion.html" class="is-active">Se connecter</a>
      <a href="inscription.html">S'inscrire</a>
    </nav>

    <h1 class="thyro-title">Se connecter</h1>
    <p class="thyro-subtitle">Entre tes identifiants pour accéder à ton compte.</p>

    <div id="loginAlert" class="thyro-alert"></div>

    <form id="loginForm" class="thyro-form" novalidate>
      <div class="thyro-field" id="loginIdentifierField">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="loginEmail" autocomplete="email" required>
        <span class="thyro-hint" id="loginIdentifierHint"></span>
      </div>

      <button type="button" class="thyro-switch-mode" id="toggleLoginMode">
        Se connecter avec un numéro de téléphone
      </button>

      <div class="thyro-field">
        <label for="loginPassword">Mot de passe</label>
        <input type="password" id="loginPassword" name="loginPassword" autocomplete="current-password" required>
      </div>

      <button type="submit" class="thyro-btn" id="loginSubmit">Se connecter</button>

      <p class="thyro-form-note">
        <a href="mot-de-passe-oublie.html">J'ai oublié mon mot de passe</a>
      </p>
    </form>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/thyro-client.js"></script>
<script src="assets/js/thyro-connexion.js"></script>
</body>
</html>
